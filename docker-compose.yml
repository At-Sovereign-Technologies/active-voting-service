services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voting-api

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=voting_db;Username=postgres;Password=postgres

    ports:
      - "8080:8080"

    depends_on:
      - postgres
      - redis
      - rabbitmq

  postgres:
    image: postgres:17
    container_name: voting-postgres

    environment:
      POSTGRES_DB: voting_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: voting-redis

    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:4-management
    container_name: voting-rabbitmq

    ports:
      - "5672:5672"
      - "15672:15672"

    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

volumes:
  postgres_data: